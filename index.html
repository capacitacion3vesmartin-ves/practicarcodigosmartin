  if(!GD.length)return modal('<h3>No hay grupos</h3><p>No hay grupos en la malla para esta sede.</p><button class="bt" onclick="closeM()">Entendido</button>');
  modal(`<h3>Asignar «${e(D.n)}»</h3><p class="lk" style="text-align:left;margin:0 0 10px">${e(ETSg(D))} · ${e(TPL[D.t||'producto'])}<br>Elige el grupo que lo va a rendir.</p><div class="asg" style="max-height:50vh;overflow:auto">${GD.map((g,i)=>{const l=lvFind(g);return `<button class="asgc" onclick="dgo('${D.id}',${i})"><b>${e(g.n)}</b><small>${g.m.length} alumno${g.m.length===1?'':'s'}</small>${l?`<span class="nm" style="background:${l.go?'#16a34a':'#f58a07'}">${e(l.dn||'Dictado')} · ${l.go?'En curso':'Esperando inicio'}</span>`:''}</button>`}).join('')}</div><button class="bt w" onclick="closeM()">Cancelar</button>`)}
function dgo(id,i){const D=DICT.items.find(x=>x.id===id),G=GD[i];if(!D||!G)return;const l=lvFind(G),go=()=>{GI=i;LVG=dvg(G,D);closeM();lvOpen()};
  if(l&&l.did!==D.id)return ask('Este grupo ya tiene un dictado asignado','«'+e(G.n)+'» tiene asignado «'+e(l.dn||'otro dictado')+'». Si continúas, esa asignación se quita y se reemplaza por «'+e(D.n)+'». Las notas ya guardadas se conservan.','Sí, reemplazar',async()=>{
    modal('<h3>Guardando…</h3><div class="sp"></div>');try{const r=await api('setLive',{g:G.n,live:null});if(!r||!r.ok)throw 0}catch(x){return modal('<h3>No se pudo reemplazar</h3><button class="bt" onclick="closeM()">Cerrar</button>')}
    LVS=(LVS||[]).filter(z=>z.n!==G.n);go()},1);
  go()}
function dopenL(n){const i=GD.findIndex(g=>g.n===n),l=(LVS||[]).find(z=>z.n===n);if(i<0||!l)return;GI=i;LVG=dvg(GD[i],{c:l.c,mo:l.mo,t:l.t,x:l.x,n:l.dn,id:l.did});lvOpen()}

/* --- tipos de evaluación, Productos dentro de Dictados y creación por temática/módulo --- */
const dtm=x=>!DT||(x.t||'producto')===DT;
function dtc(l,v){const n=v?DICT.items.filter(x=>(x.t||'producto')===v).length:DICT.items.length,on=DT===v;return `<button class="ch ${on?'on':''}" style="border-color:#4f46e5;${on?'background:#4f46e5;color:#fff':''}" onclick="dtyp('${v}')">${l} <small>(${n})</small></button>`}
function dtyp(v){DT=v;dlib()}
function dprd(){mpr()}
function dbk(){if(DIRTY)return ask('Tienes cambios sin guardar en Productos','Puedes volver a Dictados, pero esos cambios seguirán sin guardarse hasta que pulses «Guardar cambios» en Productos.','Volver a Dictados',dlib);dlib()}
function dplan(){const nu=[];let ya=0;
  Object.keys(TEM).forEach(k=>mods(k).forEach(m=>{if(m==='Sin módulo')return;
    ['producto','cliente','mixto'].forEach(t=>{const d={id:'',n:'',f:'',c:TEM[k].n,mo:[m],t,x:[]};
      if(!gpl(d).length)return;
      if(DICT.items.some(z=>(z.t||'producto')===t&&z.mo.length===1&&z.mo[0]===m&&gks(z).length===1&&gks(z)[0]===k)){ya++;return}
      nu.push({k,d})})}));
  return{nu,ya}}
function dgen(){const p=dplan();
  if(!p.nu.length)return modal('<h3>Ya están todos</h3><p>Ya existen los dictados de cada temática y módulo ('+p.ya+' en total).</p><button class="bt" onclick="closeM()">Entendido</button>');
  modal('<h3>Crear dictados por temática y módulo</h3><p class="lk" style="text-align:left">Se crea un dictado por cada módulo de cada temática, en tres tipos: <b>Por producto</b>, <b>Como lo pide el cliente</b> y <b>Mixto</b>. Ej.: «Maderas 1 - producto», «Maderas 1 - como lo pide el cliente», «Maderas 1 - mixto». Cada temática queda en su propia carpeta.</p><p><b>'+p.nu.length+'</b> dictados nuevos'+(p.ya?' · '+p.ya+' ya existían y no se tocan':'')+'.</p><button class="bt" onclick="dgenGo()">Crear</button><button class="bt w" onclick="closeM()">Cancelar</button>')}
async function dgenGo(){const{nu}=dplan();closeM();if(!nu.length)return;const bk=dcl(DICT),fid={};
  Object.keys(TEM).forEach(k=>{let f=DICT.folders.find(x=>x.n===TEM[k].n);if(!f&&nu.some(z=>z.k===k)){f={id:duid(),n:TEM[k].n};DICT.folders.push(f)}fid[k]=f?f.id:''});
  nu.forEach(({k,d},i)=>{d.id=duid()+i;d.f=fid[k];d.n=dsug(d);DICT.items.push(d)});
  if(!await dsave()){DICT=bk;return}
  DF='';DQ='';DMSG='Se crearon '+nu.length+' dictados ✔';dlib()}
